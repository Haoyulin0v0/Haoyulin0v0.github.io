{% assign entry = include.post %}
<article class="post-card" data-document-card data-tags="{{ entry.tags | jsonify | escape }}" data-search="{{ entry.title | escape }} {{ entry.description | escape }} {{ entry.tags | join: ' ' | escape }} {{ entry.content | strip_html | normalize_whitespace | escape }}">
  <div class="post-meta"><time datetime="{{ entry.date | date_to_xmlschema }}">{{ entry.date | date: '%Y.%m.%d' }}</time></div>
  <h3><a href="{{ entry.url | relative_url }}">{{ entry.title | escape }}</a></h3>
  <p>{{ entry.description | default: entry.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}</p>
  <div class="card-bottom"><div class="tags">{% for tag in entry.tags %}<a href="{{ '/documents/' | relative_url }}?tag={{ tag | url_encode }}">{{ tag | escape }}</a>{% endfor %}</div><a class="read-link" href="{{ entry.url | relative_url }}" aria-label="阅读：{{ entry.title | escape }}">阅读 →</a></div>
</article>
