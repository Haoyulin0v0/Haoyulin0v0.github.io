<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <meta name="color-scheme" content="light dark">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">h.</span>{{ site.title | escape }}<span class="brand-sub"> / notebook</span></a>
    <nav aria-label="主导航">
      {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title | escape }}</a>
      {% endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false" data-theme-toggle hidden>深色</button>
  </header>
  <main id="main" class="wrap">{{ content }}</main>
  <footer class="site-footer wrap">
    <div><a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a><p>{{ site.data.blog.footer_note | escape }}</p></div>
    <div class="footer-links"><a href="{{ '/posts/' | relative_url }}">全部文章</a><a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a><a href="https://github.com/{{ site.github_username | escape }}">GitHub ↗</a></div>
    <small>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</small>
  </footer>
</body>
</html>
