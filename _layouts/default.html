<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/settings.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <meta name="color-scheme" content="light dark">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <div class="site-background" aria-hidden="true"></div>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav aria-label="主导航">
      {% for item in site.data.navigation.main %}
      {% assign nav_prefix = page.url | slice: 0, item.url.size %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% elsif item.url != '/' and nav_prefix == item.url %}aria-current="location"{% endif %}>{{ item.title | escape }}</a>
      {% endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false" data-theme-toggle hidden>深色</button>
  </header>
  <main id="main" class="wrap{% if page.layout == 'post' %} reading-panel{% endif %}">{{ content }}</main>
  <footer class="site-footer wrap">
    <small>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</small>
    <div class="footer-links"><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="https://github.com/{{ site.github_username | escape }}">GitHub</a></div>
  </footer>
</body>
</html>
