# [SITE] 全站信息；修改后重启 Jekyll。
title: Hirasawa_Yui
description: 技术学习、日记与感想。
url: "https://haoyulin0v0.github.io"
baseurl: "" # 项目站点填 /仓库名；个人主页保持为空。
lang: zh-CN
timezone: Asia/Shanghai
author: Hirasawa_Yui
github_username: Haoyulin0v0
# [BUILD] 使用仓库内的布局，不依赖远程主题。
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
excerpt_separator: "<!--more-->"
include: [_pages]
exclude: [README.md, docs, scripts, Gemfile, Gemfile.lock, vendor]
plugins: [jekyll-feed, jekyll-sitemap]
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: life
  - scope:
      path: "_pages"
    values:
      layout: page
